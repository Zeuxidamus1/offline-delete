name: Deploy Offline Delete to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: offline-delete-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_URL: https://plapeurvvjezzdeoyxmu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_bGT_dJKEMfqnPuAw_V4BGw_uawQKARN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check pages/auth.js
      - run: node --check build-pages.mjs
      - run: node build-pages.mjs
      - name: Verify profile navigation in generated site
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const home = readFileSync('pages-dist/home.html','utf8');
          const profile = readFileSync('pages-dist/profile.html','utf8');
          if (!home.includes('href=\"/offline-delete/profile.html\"')) process.exit(1);
          if (!profile.includes('id=\"profile-form\"')) process.exit(1);
          if (!profile.includes('id=\"save-profile\"')) process.exit(1);
          const dashboard = readFileSync('pages-dist/dashboard.html','utf8');
          const scanResults = readFileSync('pages-dist/scan-results.html','utf8');
          const authBundle = readFileSync('pages-dist/account-password.js','utf8');
          if (!home.includes('href=\"./dashboard.html\"')) process.exit(1);
          if (!dashboard.includes('id=\"start-scan\"')) process.exit(1);
          if (!scanResults.includes('id=\"findings-list\"')) process.exit(1);
          if (!scanResults.includes('id=\"filter-dismissed\"')) process.exit(1);
          if (!scanResults.includes('id=\"removal-guide\"')) process.exit(1);
          for (const id of ['guide-steps','guide-show-all','guide-progress-track','guide-submitted']) {
            if (!scanResults.includes('id=\"' + id + '\"')) process.exit(1);
          }
          if (!authBundle.includes('guide_steps_completed')) process.exit(1);
          if (!authBundle.includes('privacy-scan')) process.exit(1);
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
